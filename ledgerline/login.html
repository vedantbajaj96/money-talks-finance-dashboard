<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoneyTalks — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .brand-mark {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #5ec98a, #67e8f9);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name { font-size: 18px; font-weight: 700; color: #f0f4f8; }

    h2 { font-size: 22px; font-weight: 700; color: #f0f4f8; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #64748b; margin-bottom: 28px; }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 12px; font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #2a2d3a;
      background: #0f1117;
      color: #e2e8f0;
      font-size: 14px; font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #5ec98a; }

    button[type=submit] {
      width: 100%; margin-top: 8px;
      padding: 13px;
      background: #5ec98a; color: #052015;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type=submit]:hover { background: #4db878; }
    button[type=submit]:disabled { opacity: 0.6; cursor: default; }

    .error {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.4);
      color: #f87171;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
          <path d="M3 18 L8 6 L11 13 L14 9 L19 16"
            stroke="#052015" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">MoneyTalks</div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    const app = document.getElementById('app');

    async function init() {
      const res = await fetch('/api/auth/status');
      const { needs_setup } = await res.json();
      needs_setup ? renderSetup() : renderLogin();
    }

    function renderLogin(error = '') {
      app.innerHTML = `
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account</p>
        ${error ? `<div class="error">${error}</div>` : ''}
        <form id="form">
          <div class="field"><label>Username</label>
            <input name="username" type="text" autocomplete="username" autofocus required /></div>
          <div class="field"><label>Password</label>
            <input name="password" type="password" autocomplete="current-password" required /></div>
          <button type="submit" id="btn">Sign in</button>
        </form>`;

      document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        btn.disabled = true; btn.textContent = 'Signing in…';
        const fd = new FormData(e.target);
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
        });
        if (res.ok) { window.location.href = '/'; }
        else {
          const d = await res.json();
          renderLogin(d.detail || 'Invalid username or password');
        }
      };
    }

    function renderSetup(error = '') {
      app.innerHTML = `
        <h2>Create first account</h2>
        <p class="subtitle">Set up the admin account to get started</p>
        ${error ? `<div class="error">${error}</div>` : ''}
        <form id="form">
          <div class="field"><label>Username</label>
            <input name="username" type="text" autocomplete="username" autofocus required /></div>
          <div class="field"><label>Password</label>
            <input name="password" type="password" autocomplete="new-password" required /></div>
          <button type="submit" id="btn">Create account</button>
        </form>`;

      document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        btn.disabled = true; btn.textContent = 'Creating…';
        const fd = new FormData(e.target);
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
        });
        if (res.ok) { window.location.href = '/'; }
        else {
          const d = await res.json();
          renderSetup(d.detail || 'Setup failed');
        }
      };
    }

    init();
  </script>
</body>
</html>
